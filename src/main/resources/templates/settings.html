<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title th:text="#{settings.title}"></title>
  <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
  <main>
    <nav th:replace="~{fragments :: nav}"></nav>
    <h1 th:text="#{settings.title}"></h1>
    <p th:replace="~{fragments :: error}"></p>
    <p th:if="${notice != null}" class="notice" role="status" th:text="#{${notice}}"></p>

    <section>
      <h2 th:text="#{bank.title}"></h2>
      <p th:text="#{bank.intro}"></p>
      <p th:if="${bank.configured}" th:text="#{bank.configured}"></p>
      <p th:unless="${bank.configured}" class="notice" th:text="#{bank.notConfigured}"></p>
      <p th:if="${bank.configured and !bank.redirectConfigured}" class="notice" th:text="#{bank.noRedirect}"></p>

      <h3 th:text="#{bank.consents}"></h3>
      <p th:unless="${bank.hasConsents()}" class="muted" th:text="#{bank.noConsents}"></p>
      <ul class="list" th:if="${bank.hasConsents()}">
        <li th:each="row : ${bank.consents}">
          <a th:href="@{/settings/bank/consents/{id}(id=${row.id})}" th:text="${row.bankName}"></a>
          <span class="muted" th:text="#{bank.consents.accounts(${row.linked})}"></span>
          <span th:if="${row.waiting gt 0}" class="muted" th:text="#{bank.consents.waiting(${row.waiting})}"></span>
          <span th:if="${!row.ended}" class="muted" th:text="#{bank.consent.validUntil(${row.validUntil})}"></span>
          <strong th:if="${row.ended}" class="error" th:text="#{bank.consent.expiredShort}"></strong>
          <form th:if="${row.ended}" method="post" class="inline" th:action="@{/settings/bank/consents/{id}/renew(id=${row.id})}">
            <button type="submit" class="secondary" th:text="#{bank.renew}"></button>
          </form>
        </li>
      </ul>
      <p th:if="${bank.configured and bank.redirectConfigured}">
        <a class="button" th:href="@{/settings/bank/link}" th:text="#{bank.link}"></a>
      </p>

      <h3 th:text="#{bank.runs}"></h3>
      <p th:unless="${bank.hasRuns()}" class="muted" th:text="#{bank.noRuns}"></p>
      <ul class="list runs" th:if="${bank.hasRuns()}">
        <li th:each="run : ${bank.runs}">
          <span class="muted" th:text="${run.when}"></span>
          <a th:href="@{/accounts/{id}(id=${run.accountId})}" th:text="${run.accountName}"></a>
          <span class="muted" th:text="#{${run.triggerKey}}"></span>
          <strong th:if="${run.ok}" th:text="#{bank.run.ok}"></strong>
          <strong th:unless="${run.ok}" class="error" th:text="#{bank.run.failed(#{${run.reasonKey}})}"></strong>
          <span th:if="${run.ok}" class="muted" th:text="#{bank.run.counts(${run.added}, ${run.updated}, ${run.known}, ${run.refused})}"></span>
          <span th:if="${run.ok and (run.pendingRemoved gt 0 or run.pendingKept gt 0)}" class="muted"
                th:text="#{bank.run.pending(${run.pendingRemoved}, ${run.pendingKept})}"></span>
        </li>
      </ul>
    </section>

    <section>
      <h2 th:text="#{backup.title}"></h2>
      <p th:text="#{backup.intro}"></p>
      <p class="notice" th:text="#{backup.secrets}"></p>

      <h3 th:text="#{backup.download.title}"></h3>
      <form method="post" th:action="@{/settings/backup/download}">
        <p class="actions">
          <button type="submit" th:text="#{backup.download}"></button>
        </p>
      </form>

      <h3 th:text="#{backup.restore.title}"></h3>
      <p th:text="#{backup.restore.intro}"></p>
      <form method="post" th:action="@{/settings/backup/check}" enctype="multipart/form-data">
        <p>
          <label for="file" th:text="#{backup.restore.file}"></label>
          <input id="file" name="file" type="file" accept=".zip,application/zip" required>
        </p>
        <p class="actions">
          <button type="submit" class="secondary" th:text="#{backup.restore.check}"></button>
        </p>
      </form>

      <th:block th:if="${hasPrevious}">
        <h3 th:text="#{backup.undo.title}"></h3>
        <p th:text="#{backup.undo.intro(${previousFrom})}"></p>
        <form method="post" th:action="@{/settings/backup/undo}">
          <p>
            <label for="undo-confirm" th:text="#{backup.undo.type(${undoWord})}"></label>
            <input id="undo-confirm" name="confirm" type="text" autocomplete="off" required>
          </p>
          <p class="actions">
            <button type="submit" class="danger" th:text="#{backup.undo}"></button>
          </p>
        </form>
      </th:block>
    </section>
  </main>
</body>
</html>
