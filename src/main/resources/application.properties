# The data folder has no default: finances.data-dir (or FINANCES_DATA_DIR) must be set.
spring.application.name=finances-dashboard
server.address=127.0.0.1
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never
spring.main.banner-mode=off
spring.thymeleaf.cache=true
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false
# Largest CSV file that can be uploaded for an import (checked by the import page; a backup upload has no limit).
# The file is held in memory while it is previewed and dropped when the import is done; raise this with care
# on a machine with little memory.
finances.import.max-file-size=10MB
