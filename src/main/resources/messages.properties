settings.title=Settings

backup.title=Backup
backup.intro=The data folder is the only copy of everything entered by hand. A backup is one file with a consistent snapshot of the database; it can be made while the application is running.
backup.secrets=Secrets are not in the backup: the bank application key, session ids and tokens stay in the data folder. After a restore on a new machine the bank links must be renewed. The install guide (docs/install.md) lists the secret files for those who want to copy them separately. The backup file holds all your financial data: keep it somewhere only you can read.
backup.download.title=Download a backup
backup.download=Download backup
backup.restore.title=Restore from a backup
backup.restore.intro=Restoring replaces everything in the application with what is in the backup file. You see what it holds and confirm before anything changes. The database in use now is kept, so one restore can be undone.
backup.restore.file=Backup file
backup.restore.check=Check the backup file
backup.undo.title=Undo the last restore
backup.undo.intro=The database as it was before the last restore is kept (last written {0}). Going back replaces what is in use now, which is kept in its place.
backup.undo.type=Type {0} to confirm
backup.undo=Undo the last restore
backup.done.restored=The backup was restored. The database from before is kept, and the last restore can be undone below.
backup.done.undone=The database from before the last restore is back in use.

backup.error.no_database=There is no database yet, so there is nothing to back up.
backup.error.not_a_backup=This file is not a backup made by this application. Nothing was changed.
backup.error.damaged=This backup file is cut off or damaged. Nothing was changed.
backup.error.newer_format=This backup was made by a newer version of the application. Update the application first. Nothing was changed.
backup.error.newer_schema=This backup holds a newer database than this version of the application knows. Update the application first. Nothing was changed.
backup.error.busy=The database is in use right now. Nothing was changed; try again in a minute.
backup.error.failed=The disk or the file could not be used (is the disk full?). The database in use is untouched.
backup.error.migration_failed=The restored database could not be brought up to date. The old database is back in use; nothing was changed.
backup.error.not_confirmed=The word was not typed correctly. Nothing was changed.
backup.error.unknown_upload=That upload is gone. Choose the backup file again.
backup.error.nothing_to_undo=There is no earlier database to go back to.
backup.error.target_exists=The target file already exists.
backup.error.leftover=An earlier restore left a database aside as finances.replaced.db in the data folder. It may hold data that exists nowhere else, so nothing was changed. See the install guide (docs/install.md) before restoring again.
backup.error.not_enough_space=There is not enough free disk space in the data folder to restore this backup. Nothing was changed. Free some space and try again.
backup.error.old_database_aside=The restore (or undo) failed and the database that was in use could not be put back. It is kept as finances.replaced.db in the data folder and nothing was deleted. Stop the service and follow the install guide (docs/install.md) before doing anything else.

