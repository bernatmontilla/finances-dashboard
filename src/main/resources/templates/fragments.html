<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title th:text="#{app.name}"></title>
</head>
<body>
  <nav th:fragment="nav" class="nav">
    <a th:href="@{/}" th:text="#{nav.overview}"></a>
    <a th:href="@{/accounts}" th:text="#{nav.accounts}"></a>
    <a th:href="@{/transactions}" th:text="#{nav.transactions}"></a>
    <a th:href="@{/reservations}" th:text="#{nav.reservations}"></a>
    <a th:href="@{/fixed-costs}" th:text="#{nav.fixedCosts}"></a>
    <a th:href="@{/settings}" th:text="#{nav.settings}"></a>
  </nav>

  <p th:fragment="error" th:if="${error != null}" class="error" role="alert" th:text="#{${error}}"></p>

  <span th:fragment="balance(view, debt)" class="balance">
    <span th:if="${view == null}" class="muted" th:text="#{balance.none}"></span>
    <span th:if="${view != null}">
      <strong th:if="${!debt}" class="amount" th:text="${view.amount}"></strong>
      <strong th:if="${debt}" class="amount owed" th:text="#{balance.owed(${view.amount})}"></strong>
      <span class="muted" th:text="#{balance.asOf(${view.date})}"></span>
      <span class="muted" th:text="#{${view.ageKey}(${view.ageArg})}"></span>
      <span th:if="${view.hasNote()}" class="muted" th:text="#{${view.noteKey}(${view.noteArg})}"></span>
    </span>
  </span>

  <!-- A stale figure is marked by a word and a sign, never by colour alone; the reason opens on tap or hover. -->
  <details th:fragment="stale(view)" th:if="${view != null}" class="stale"
           th:title="${view.hasDetail()} ? #{${view.key}(#{${view.detailKey}})} : #{${view.key}(${view.arg})}">
    <summary th:text="#{stale.mark}"></summary>
    <span th:if="${!view.hasDetail()}" th:text="#{${view.key}(${view.arg})}"></span>
    <span th:if="${view.hasDetail()}" th:text="#{${view.key}(#{${view.detailKey}})}"></span>
  </details>

  <!--
    A headline number (issue #19): its title, its amount (or the one line that says why there is none), the age of its oldest
    counted part, and a stale mark that names every stale part when opened. The amount links to the build-up when `linked`.
  -->
  <div th:fragment="headline(headline, linked)" class="headline">
    <h2 class="headline-title">
      <a th:if="${linked}" th:href="@{/build-up/{slug}(slug=${headline.slug})}" th:text="#{${headline.titleKey}}"></a>
      <span th:unless="${linked}" th:text="#{${headline.titleKey}}"></span>
    </h2>
    <th:block th:if="${headline.shown()}">
      <p class="headline-amount" th:classappend="${headline.negative} ? 'negative'">
        <a th:if="${linked}" th:href="@{/build-up/{slug}(slug=${headline.slug})}" th:text="${headline.amount}"></a>
        <span th:unless="${linked}" th:text="${headline.amount}"></span>
      </p>
      <p th:if="${headline.negative}" class="headline-negative" th:text="#{headline.negative}"></p>
      <p class="muted headline-age">
        <span th:if="${headline.severalParts}" th:text="#{headline.oldest}"></span>
        <span th:text="#{balance.asOf(${headline.oldest.date})}"></span>
        <span th:text="#{${headline.oldest.ageKey}(${headline.oldest.ageArg})}"></span>
      </p>
      <details th:if="${headline.hasStale()}" class="stale headline-stale">
        <summary th:text="#{stale.mark}"></summary>
        <div>
          <p th:text="#{headline.stale.intro}"></p>
          <ul class="stale-parts">
            <li th:each="part : ${headline.stale}">
              <strong th:if="${part.hasName()}" th:text="${part.name}"></strong>
              <strong th:unless="${part.hasName()}" th:text="#{${part.nameKey}}"></strong>
              <span th:if="${!part.stale.hasDetail()}" th:text="#{${part.stale.key}(${part.stale.arg})}"></span>
              <span th:if="${part.stale.hasDetail()}" th:text="#{${part.stale.key}(#{${part.stale.detailKey}})}"></span>
            </li>
          </ul>
        </div>
      </details>
    </th:block>
    <th:block th:unless="${headline.shown()}">
      <p class="headline-hidden" th:text="#{${headline.hidden.textKey}}"></p>
      <ul th:if="${headline.hidden.hasLinks()}" class="attention headline-links">
        <li th:each="link : ${headline.hidden.links}">
          <a th:href="@{${link.href}}" th:text="${link.hasKey()} ? #{${link.textKey}} : ${link.text}"></a>
        </li>
      </ul>
    </th:block>
  </div>

  <span th:fragment="delivered(view)" class="muted delivered">
    <span th:if="${view == null}" th:text="#{transactions.neverDelivered}"></span>
    <th:block th:if="${view != null}">
      <span th:text="#{transactions.delivered(${view.date})}"></span>
      <span th:text="#{${view.ageKey}(${view.ageDays})}"></span>
    </th:block>
  </span>

  <!--
    What "still to come" rests on (issue #63, hard rule 9): fixed costs are matched against transactions, so the figure is as current as
    the least current delivery of the accounts involved, and stale when one of them is.
  -->
  <div th:fragment="fixedBasis(basis)" class="muted fixed-basis">
    <span th:text="#{fixedcosts.basis}"></span>
    <span th:replace="~{fragments :: delivered(${basis.delivery})}"></span>
    <th:block th:replace="~{fragments :: stale(${basis.stale})}"></th:block>
  </div>

  <!-- An open reservation (issue #20): its name, due date and what is reserved so far; the overdue flag is a word, not a colour. -->
  <span th:fragment="reservationDue(row)" class="reservation-due">
    <strong th:text="${row.name}"></strong>
    <span class="muted nowrap" th:text="#{reservation.due(${row.dueDate})}"></span>
    <span th:if="${row.overdue}" class="pending" th:text="#{reservation.overdue}"></span>
    <span th:if="${row.yearly}" class="muted" th:text="#{reservation.yearly.mark}"></span>
    <span class="amount" th:text="#{reservation.reservedOf(${row.reserved}, ${row.amount})}"></span>
  </span>

  <!-- One fixed cost: what it is, where it stands this month (a word, never a colour alone) and what can be done with it. -->
  <li th:fragment="fixedCost(row)">
    <strong class="fc-name" th:text="${row.name}"></strong>
    <span class="amount fc-amount" th:text="#{fixedcosts.amountEvery(${row.amount}, #{${row.rhythmKey}})}"></span>
    <span class="muted" th:if="${row.hasCounterparty()}" th:text="${row.counterparty}"></span>
    <span class="muted" th:if="${row.hasAccount()}" th:text="#{fixedcosts.from(${row.account})}"></span>
    <span class="balance">
      <strong th:text="#{'fixedcosts.status.' + ${row.status}}"></strong>
      <span class="muted nowrap" th:if="${row.hasExpected()}" th:text="#{fixedcosts.expected(${row.expected})}"></span>
      <span class="muted" th:if="${row.hasPayment()}" th:text="#{fixedcosts.paidBy(${row.paidOn}, ${row.paidAmount})}"></span>
      <span class="pending" th:if="${row.overdue}" th:text="#{fixedcosts.overdue}"></span>
      <span class="muted nowrap" th:if="${row.hasNextDue()}" th:text="#{fixedcosts.nextDue(${row.nextDue})}"></span>
      <span class="muted nowrap" th:if="${row.hasEndedOn()}" th:text="#{fixedcosts.endedOn(${row.endedOn})}"></span>
    </span>
    <span class="actions">
      <form method="post" th:if="${row.tickable() and !row.paid()}" th:action="@{/fixed-costs/{id}/tick(id=${row.id})}" class="inline">
        <button type="submit" class="secondary" th:text="#{fixedcosts.tick}"></button>
      </form>
      <form method="post" th:if="${row.paid()}" th:action="@{/fixed-costs/{id}/untick(id=${row.id})}" class="inline">
        <button type="submit" class="secondary" th:text="#{fixedcosts.untick}"></button>
      </form>
      <a th:unless="${row.ended()}" th:href="@{/fixed-costs/{id}/edit(id=${row.id})}" th:text="#{fixedcosts.edit}"></a>
      <form method="post" th:if="${!row.paused() and !row.ended()}" th:action="@{/fixed-costs/{id}/pause(id=${row.id})}" class="inline">
        <button type="submit" class="link" th:text="#{fixedcosts.pause}"></button>
      </form>
      <form method="post" th:if="${row.paused() or row.ended()}" th:action="@{/fixed-costs/{id}/resume(id=${row.id})}" class="inline">
        <button type="submit" class="link" th:text="#{fixedcosts.resume}"></button>
      </form>
      <form method="post" th:unless="${row.ended()}" th:action="@{/fixed-costs/{id}/end(id=${row.id})}" class="inline">
        <button type="submit" class="link" th:text="#{fixedcosts.end}"></button>
      </form>
    </span>
  </li>

  <th:block th:fragment="transactions(view, showAccount, path)">
    <p th:if="${view.empty and !view.hasPrevious}" th:text="#{transactions.none}"></p>
    <p th:if="${view.empty and view.hasPrevious}" th:text="#{transactions.noMore}"></p>
    <ul th:unless="${view.empty}" class="list transactions">
      <li th:each="row : ${view.rows}">
        <span class="meta muted">
          <span th:text="${row.date}"></span>
          <a th:if="${showAccount}" th:href="@{/accounts/{id}(id=${row.accountId})}" th:text="${row.accountName}"></a>
          <span th:if="${row.pending}" class="pending" th:text="#{transactions.pending}"></span>
          <span th:if="${row.noLongerReported}" class="pending" th:text="#{transactions.noLongerReported}"></span>
        </span>
        <span class="who">
          <strong th:if="${row.hasCounterparty()}" th:text="${row.counterparty}"></strong>
          <strong th:unless="${row.hasCounterparty()}" class="muted" th:text="#{transactions.noCounterparty}"></strong>
          <span th:if="${row.hasDescription()}" class="muted" th:text="${row.description}"></span>
          <span th:if="${row.hasNote()}" class="note" th:text="${row.note}"></span>
        </span>
        <span class="amount" th:text="${row.amount}"></span>
      </li>
    </ul>
    <p th:if="${view.hasPrevious or view.hasNext}" class="pager">
      <a th:if="${view.hasPrevious}" th:href="@{${path}(page=${view.previous})}" th:text="#{transactions.newer}"></a>
      <a th:if="${view.hasNext}" th:href="@{${path}(page=${view.next})}" th:text="#{transactions.older}"></a>
    </p>
  </th:block>
</body>
</html>
