<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title th:text="#{fixedcosts.title}"></title>
  <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
  <main>
    <nav th:replace="~{fragments :: nav}"></nav>
    <h1 th:text="#{fixedcosts.title}"></h1>
    <p class="muted" th:text="#{fixedcosts.intro}"></p>
    <p class="muted"><span th:text="#{fixedcosts.hint}"></span> <a th:href="@{/reservations}" th:text="#{fixedcosts.toReservations}"></a></p>
    <p th:replace="~{fragments :: error}"></p>
    <p><a class="button" th:href="@{/fixed-costs/new}" th:text="#{fixedcosts.add}"></a></p>
    <section th:if="${!proposals.empty}" id="proposals">
      <h2 th:text="#{fixedcosts.proposals.title}"></h2>
      <p class="muted" th:text="#{fixedcosts.proposals.note}"></p>
      <ul class="list fixed-costs">
        <li th:each="proposal : ${proposals}" class="fixed-cost-proposal">
          <strong class="fc-name" th:text="${proposal.name}"></strong>
          <span class="amount fc-amount" th:text="#{fixedcosts.amountEvery(${proposal.amount}, #{${proposal.rhythmKey}})}"></span>
          <span class="muted" th:text="#{${proposal.scopeKey}}"></span>
          <span class="muted" th:text="#{fixedcosts.proposal.seen(${proposal.charges}, ${proposal.latestBooked})}"></span>
          <div class="actions">
            <a class="button" th:href="@{/fixed-costs/new(proposal=${proposal.id})}" th:text="#{fixedcosts.proposal.add}"></a>
            <form method="post" th:action="@{/fixed-costs/proposals/{id}/reject(id=${proposal.id})}" class="inline">
              <button type="submit" class="secondary" th:text="#{fixedcosts.proposal.reject}"></button>
            </form>
          </div>
        </li>
      </ul>
    </section>
    <p th:if="${groups.empty}" th:text="#{fixedcosts.none}"></p>
    <section th:each="group : ${groups}" th:id="${'scope-' + group.slug}">
      <h2 th:text="#{${group.labelKey}}"></h2>
      <p th:if="${group.hasRunning()}">
        <strong class="amount" th:text="#{fixedcosts.perMonth(${group.perMonth})}"></strong>
        <span class="muted" th:text="#{fixedcosts.perYear(${group.perYear})}"></span>
      </p>
      <p th:unless="${group.hasRunning()}" class="muted" th:text="#{fixedcosts.noneRunning}"></p>
      <th:block th:if="${group.hasBasis()}"><div th:replace="~{fragments :: fixedBasis(${group.basis})}"></div></th:block>
      <ul class="list fixed-costs" th:if="${group.hasRunning()}">
        <th:block th:each="row : ${group.running}"><li th:replace="~{fragments :: fixedCost(${row})}"></li></th:block>
      </ul>
      <th:block th:if="${!group.paused.empty}">
        <h3 th:text="#{fixedcosts.paused}"></h3>
        <p class="muted" th:text="#{fixedcosts.pausedNote}"></p>
        <ul class="list fixed-costs">
          <th:block th:each="row : ${group.paused}"><li th:replace="~{fragments :: fixedCost(${row})}"></li></th:block>
        </ul>
      </th:block>
      <th:block th:if="${!group.ended.empty}">
        <h3 th:text="#{fixedcosts.ended}"></h3>
        <ul class="list fixed-costs closed">
          <th:block th:each="row : ${group.ended}"><li th:replace="~{fragments :: fixedCost(${row})}"></li></th:block>
        </ul>
      </th:block>
    </section>
    <details th:if="${!rejections.empty}" id="rejections">
      <summary th:text="#{fixedcosts.rejections.title(${rejections.size()})}"></summary>
      <p class="muted" th:text="#{fixedcosts.rejections.note}"></p>
      <ul class="list">
        <li th:each="rejection : ${rejections}">
          <strong th:text="${rejection.name}"></strong>
          <span class="amount" th:text="${rejection.amount}"></span>
          <span class="muted" th:text="#{${rejection.scopeKey}}"></span>
          <form method="post" th:action="@{/fixed-costs/rejections/{id}/undo(id=${rejection.id})}" class="inline">
            <button type="submit" class="secondary" th:text="#{fixedcosts.rejection.undo}"></button>
          </form>
        </li>
      </ul>
    </details>
  </main>
</body>
</html>
