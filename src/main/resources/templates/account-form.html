<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title th:text="${account == null} ? #{account.new.title} : #{account.edit.title}"></title>
  <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
  <main>
    <nav th:replace="~{fragments :: nav}"></nav>
    <h1 th:text="${account == null} ? #{account.new.title} : #{account.edit.title}"></h1>
    <p th:replace="~{fragments :: error}"></p>
    <form method="post" th:action="${account == null} ? @{/accounts} : @{/accounts/{id}(id=${account.id})}">
      <p>
        <label for="name" th:text="#{account.field.name}"></label>
        <input id="name" name="name" type="text" maxlength="100" required th:value="${name}">
      </p>
      <p>
        <label for="scope" th:text="#{account.field.scope}"></label>
        <select id="scope" name="scope">
          <option th:each="code : ${scopes}" th:value="${code}" th:selected="${code == scope}" th:text="#{'scope.' + ${code}}"></option>
        </select>
      </p>
      <p>
        <label for="kind" th:text="#{account.field.kind}"></label>
        <select id="kind" name="kind">
          <option th:each="code : ${kinds}" th:value="${code}" th:selected="${code == kind}" th:text="#{'kind.' + ${code}}"></option>
        </select>
        <span class="muted" th:text="#{account.debtHint}"></span>
      </p>
      <p>
        <label for="iban" th:text="#{account.field.iban}"></label>
        <input id="iban" name="iban" type="text" maxlength="40" autocomplete="off" th:value="${iban}">
      </p>
      <p class="actions">
        <button type="submit" th:text="#{account.save}"></button>
        <a th:href="${account == null} ? @{/accounts} : @{/accounts/{id}(id=${account.id})}" th:text="#{account.cancel}"></a>
      </p>
    </form>
  </main>
</body>
</html>
