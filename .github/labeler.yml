# Labels set automatically on every pull request by the paths it changes (pr-labels.yml,
# actions/labeler). risk:high means: Claude reviews the PR in CI, and its reviewer hands these files
# to the Opus risk-checker subagent. A PR without it is reviewed by the worker's own reviewer only,
# so a path that can break what must never break belongs here. When in doubt, add it.
# The review itself is risky too: changes to how review works always get reviewed.

risk:high:
  - changed-files:
      - any-glob-to-any-file:
          # Amounts and the headline numbers; bank sync, CSV import, backup; everything that
          # talks to another host; the database schema; configuration; what installs and updates
          # the app on someone's machine; the public contracts. Main code and its tests.
          - src/*/java/finances/money/**
          - src/*/java/finances/sync/**
          - src/*/java/finances/importing/**
          - src/*/java/finances/backup/**
          - src/*/java/finances/outbound/**
          - src/main/resources/db/migration/**
          - src/main/resources/application*
          - pom.xml
          - deploy/**
          - docs/contracts/**
          - .github/**
          - .claude/**
          - AGENTS.md
          - scripts/dev/**
