<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title th:text="${cost == null} ? #{fixedcost.new.title} : #{fixedcost.edit.title}"></title>
  <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
  <main>
    <nav th:replace="~{fragments :: nav}"></nav>
    <h1 th:text="${cost == null} ? #{fixedcost.new.title} : #{fixedcost.edit.title}"></h1>
    <p th:replace="~{fragments :: error}"></p>
    <form method="post" th:action="${cost == null} ? @{/fixed-costs} : @{/fixed-costs/{id}(id=${cost.id})}">
      <p>
        <label for="name" th:text="#{fixedcost.field.name}"></label>
        <input id="name" name="name" type="text" maxlength="100" required th:value="${name}">
      </p>
      <p>
        <label for="scope" th:text="#{fixedcost.field.scope}"></label>
        <select id="scope" name="scope">
          <option th:each="code : ${scopes}" th:value="${code}" th:selected="${code == scope}" th:text="#{'scope.' + ${code}}"></option>
        </select>
      </p>
      <p>
        <label for="amount" th:text="#{fixedcost.field.amount}"></label>
        <input id="amount" name="amount" type="text" inputmode="decimal" autocomplete="off" required th:value="${amount}">
      </p>
      <p>
        <label for="rhythm" th:text="#{fixedcost.field.rhythm}"></label>
        <select id="rhythm" name="rhythm">
          <option th:each="code : ${rhythms}" th:value="${code}" th:selected="${code == rhythm}" th:text="#{'rhythm.' + ${code}}"></option>
        </select>
      </p>
      <p>
        <label for="firstDue" th:text="#{fixedcost.field.firstDue}"></label>
        <input id="firstDue" name="firstDue" type="date" required th:value="${firstDue}">
        <span class="muted" th:text="#{fixedcost.firstDueHint}"></span>
      </p>
      <p>
        <label for="counterparty" th:text="#{fixedcost.field.counterparty}"></label>
        <input id="counterparty" name="counterparty" type="text" maxlength="100" th:value="${counterparty}">
      </p>
      <p>
        <label for="iban" th:text="#{fixedcost.field.iban}"></label>
        <input id="iban" name="iban" type="text" autocomplete="off" th:value="${iban}">
      </p>
      <p>
        <label for="account" th:text="#{fixedcost.field.account}"></label>
        <select id="account" name="account">
          <option value="" th:selected="${account == ''}" th:text="#{fixedcost.noAccount}"></option>
          <option th:each="option : ${accountOptions}" th:value="${option.value}" th:selected="${option.value == account}"
                  th:text="#{fixedcost.accountOption(${option.name}, #{${option.scopeKey}})}"></option>
        </select>
        <span class="muted" th:text="#{fixedcost.accountHint}"></span>
      </p>
      <p class="muted" th:text="#{fixedcost.tickHint}"></p>
      <p class="actions">
        <button type="submit" th:text="#{fixedcost.save}"></button>
        <a th:href="@{/fixed-costs}" th:text="#{fixedcost.cancel}"></a>
      </p>
    </form>
    <form th:if="${cost != null}" method="post" th:action="@{/fixed-costs/{id}/remove(id=${cost.id})}">
      <p><button type="submit" class="danger" th:text="#{fixedcost.remove}"></button></p>
    </form>
  </main>
</body>
</html>
