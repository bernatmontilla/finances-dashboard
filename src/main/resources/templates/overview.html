<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title th:text="#{app.name}"></title>
  <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
  <main>
    <nav th:replace="~{fragments :: nav}"></nav>
    <h1 th:text="#{app.name}"></h1>
    <p class="muted" th:text="#{overview.version(${version})}"></p>
    <h2 th:text="#{overview.title}"></h2>
    <p th:if="${syncKey != null}" class="notice" role="status" th:text="#{${syncKey}(${syncOk}, ${syncFailed})}"></p>
    <form th:if="${canSync}" method="post" th:action="@{/sync}">
      <p class="actions">
        <button type="submit" class="secondary" th:text="#{bank.syncNow}"></button>
        <span class="muted" th:text="#{bank.syncNow.hint}"></span>
      </p>
    </form>
    <th:block th:if="${groups.empty}">
      <p th:text="#{overview.noAccounts}"></p>
      <p><a class="button" th:href="@{/accounts/new}" th:text="#{overview.addAccount}"></a></p>
    </th:block>
    <section th:each="group : ${groups}">
      <h3 th:text="#{${group.labelKey}}"></h3>
      <ul class="list">
        <li th:each="row : ${group.rows}">
          <a th:href="@{/accounts/{id}(id=${row.id})}" th:text="${row.name}"></a>
          <span class="muted" th:text="#{${row.kindKey}}"></span>
          <span th:replace="~{fragments :: balance(${row.balance}, ${row.debt})}"></span>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
