<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title th:text="#{accounts.title}"></title>
  <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
  <main>
    <nav th:replace="~{fragments :: nav}"></nav>
    <h1 th:text="#{accounts.title}"></h1>
    <p><a class="button" th:href="@{/accounts/new}" th:text="#{accounts.add}"></a></p>
    <p th:if="${groups.empty and archivedGroups.empty}" th:text="#{accounts.none}"></p>
    <section th:each="group : ${groups}">
      <h2 th:text="#{${group.labelKey}}"></h2>
      <ul class="list">
        <li th:each="row : ${group.rows}">
          <a th:href="@{/accounts/{id}(id=${row.id})}" th:text="${row.name}"></a>
          <span class="muted" th:text="#{${row.kindKey}}"></span>
          <span th:replace="~{fragments :: balance(${row.balance}, ${row.debt})}"></span>
          <span th:replace="~{fragments :: delivered(${row.delivery})}"></span>
        </li>
      </ul>
    </section>
    <section th:if="${!archivedGroups.empty}">
      <h2 th:text="#{accounts.archived}"></h2>
      <ul class="list">
        <th:block th:each="group : ${archivedGroups}">
          <li th:each="row : ${group.rows}">
            <a th:href="@{/accounts/{id}(id=${row.id})}" th:text="${row.name}"></a>
            <span class="muted" th:text="#{${group.labelKey}}"></span>
            <span class="muted" th:text="#{${row.kindKey}}"></span>
            <span th:replace="~{fragments :: balance(${row.balance}, ${row.debt})}"></span>
            <span th:replace="~{fragments :: delivered(${row.delivery})}"></span>
            <form method="post" th:action="@{/accounts/{id}/restore(id=${row.id})}" class="inline">
              <button type="submit" class="link" th:text="#{accounts.restore}"></button>
            </form>
          </li>
        </th:block>
      </ul>
    </section>
  </main>
</body>
</html>
