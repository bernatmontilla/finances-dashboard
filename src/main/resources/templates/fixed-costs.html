<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title th:text="#{fixedcosts.title}"></title>
  <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
  <main>
    <nav th:replace="~{fragments :: nav}"></nav>
    <h1 th:text="#{fixedcosts.title}"></h1>
    <p class="muted" th:text="#{fixedcosts.intro}"></p>
    <p class="muted"><span th:text="#{fixedcosts.hint}"></span> <a th:href="@{/reservations}" th:text="#{fixedcosts.toReservations}"></a></p>
    <p th:replace="~{fragments :: error}"></p>
    <p><a class="button" th:href="@{/fixed-costs/new}" th:text="#{fixedcosts.add}"></a></p>
    <p th:if="${groups.empty}" th:text="#{fixedcosts.none}"></p>
    <section th:each="group : ${groups}" th:id="${'scope-' + group.slug}">
      <h2 th:text="#{${group.labelKey}}"></h2>
      <p th:if="${group.hasRunning()}">
        <strong class="amount" th:text="#{fixedcosts.perMonth(${group.perMonth})}"></strong>
        <span class="muted" th:text="#{fixedcosts.perYear(${group.perYear})}"></span>
      </p>
      <p th:unless="${group.hasRunning()}" class="muted" th:text="#{fixedcosts.noneRunning}"></p>
      <ul class="list fixed-costs" th:if="${group.hasRunning()}">
        <th:block th:each="row : ${group.running}"><li th:replace="~{fragments :: fixedCost(${row})}"></li></th:block>
      </ul>
      <th:block th:if="${!group.paused.empty}">
        <h3 th:text="#{fixedcosts.paused}"></h3>
        <p class="muted" th:text="#{fixedcosts.pausedNote}"></p>
        <ul class="list fixed-costs">
          <th:block th:each="row : ${group.paused}"><li th:replace="~{fragments :: fixedCost(${row})}"></li></th:block>
        </ul>
      </th:block>
      <th:block th:if="${!group.ended.empty}">
        <h3 th:text="#{fixedcosts.ended}"></h3>
        <ul class="list fixed-costs closed">
          <th:block th:each="row : ${group.ended}"><li th:replace="~{fragments :: fixedCost(${row})}"></li></th:block>
        </ul>
      </th:block>
    </section>
  </main>
</body>
</html>
