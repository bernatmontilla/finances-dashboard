<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title th:text="#{app.name}"></title>
  <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
  <main>
    <nav th:replace="~{fragments :: nav}"></nav>
    <h1 th:text="#{app.name}"></h1>
    <p class="muted" th:text="#{overview.version(${version})}"></p>
    <section class="headlines" id="headlines">
      <th:block th:each="headline : ${headlines}">
        <div th:replace="~{fragments :: headline(${headline}, true)}"></div>
      </th:block>
    </section>
    <section th:each="group : ${reservationGroups}" class="reservations-glance">
      <h2><a th:href="@{/reservations}" th:text="#{overview.reservations(#{${group.labelKey}})}"></a></h2>
      <p><strong class="amount" th:text="#{overview.reserved(${group.reserved})}"></strong></p>
      <p th:if="${group.noNumber}" class="muted" th:text="#{reservation.noBusinessNumber}"></p>
      <ul class="list">
        <li th:each="row : ${group.open}"><span th:replace="~{fragments :: reservationDue(${row})}"></span></li>
      </ul>
    </section>
    <section th:each="group : ${fixedCostsComing}" class="fixed-costs-glance" th:id="${'fixed-costs-' + group.slug}">
      <details>
        <summary th:text="#{overview.fixedCostsComing(#{${group.labelKey}}, ${group.total})}"></summary>
        <ul class="list">
          <li th:each="row : ${group.rows}">
            <strong th:text="${row.name}"></strong>
            <span class="amount" th:text="${row.amount}"></span>
            <span class="muted nowrap" th:text="#{fixedcosts.expected(${row.expected})}"></span>
            <span class="pending" th:if="${row.overdue}" th:text="#{fixedcosts.overdue}"></span>
          </li>
        </ul>
        <th:block th:if="${group.hasBasis()}"><div th:replace="~{fragments :: fixedBasis(${group.basis})}"></div></th:block>
        <p class="muted" th:text="#{overview.fixedCostsNote}"></p>
        <p><a th:href="@{/fixed-costs}" th:text="#{overview.fixedCostsAll}"></a></p>
      </details>
    </section>
    <div th:if="${!attention.empty}" class="notice warning" id="attention">
      <span th:text="#{overview.stale(${attention.size()})}"></span>
      <ul class="attention">
        <li th:each="row : ${attention}"><a th:href="@{/accounts/{id}(id=${row.id})}" th:text="${row.name}"></a></li>
      </ul>
    </div>
    <div th:each="expiring : ${expiring}" class="notice">
      <p th:text="#{overview.consentEnds(${expiring.bankName}, ${expiring.endsOn}, ${expiring.daysLeft})}"></p>
      <form method="post" th:action="@{/settings/bank/consents/{id}/renew(id=${expiring.consentId})}">
        <p class="actions"><button type="submit" th:text="#{bank.renew}"></button></p>
      </form>
    </div>
    <h2 th:text="#{overview.title}"></h2>
    <p th:if="${syncKey != null}" class="notice" role="status" th:text="#{${syncKey}(${syncOk}, ${syncFailed})}"></p>
    <form th:if="${canSync}" method="post" th:action="@{/sync}">
      <p class="actions">
        <button type="submit" class="secondary" th:text="#{bank.syncNow}"></button>
        <span class="muted" th:text="#{bank.syncNow.hint}"></span>
      </p>
    </form>
    <th:block th:if="${groups.empty}">
      <p th:text="#{overview.noAccounts}"></p>
      <p><a class="button" th:href="@{/accounts/new}" th:text="#{overview.addAccount}"></a></p>
    </th:block>
    <section th:each="group : ${groups}">
      <h3 th:text="#{${group.labelKey}}"></h3>
      <ul class="list">
        <li th:each="row : ${group.rows}">
          <a th:href="@{/accounts/{id}(id=${row.id})}" th:text="${row.name}"></a>
          <span class="muted" th:text="#{${row.kindKey}}"></span>
          <span th:replace="~{fragments :: balance(${row.balance}, ${row.debt})}"></span>
          <th:block th:replace="~{fragments :: stale(${row.stale})}"></th:block>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
